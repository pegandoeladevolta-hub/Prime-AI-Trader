name: Build PRIME AI TRADER for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-installer
    paths-ignore:
      - BUILD_STATUS.json

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build and test application
        shell: powershell
        run: .\build_windows.ps1

      - name: Verify deliverables
        shell: powershell
        run: |
          if (-not (Test-Path "release\PrimeAITrader.exe")) { throw "PrimeAITrader.exe was not generated" }
          if (-not (Test-Path "release\PrimeAITrader-Setup-x64.exe")) { throw "Installer was not generated" }
          Get-FileHash "release\PrimeAITrader.exe" -Algorithm SHA256
          Get-FileHash "release\PrimeAITrader-Setup-x64.exe" -Algorithm SHA256

      - name: Upload Windows installer
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-AI-TRADER-Windows-x64
          path: |
            release/PrimeAITrader.exe
            release/PrimeAITrader-Setup-x64.exe
            README.md
            RELEASE_NOTES.md
            VALIDATION_REPORT.md
          if-no-files-found: error
          retention-days: 7

      - name: Publish build status
        shell: powershell
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_COMMIT_SHA: ${{ github.sha }}
          BUILD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          BUILD_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          BUILD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          $status = [ordered]@{
            status = "success"
            run_id = [long]$env:BUILD_RUN_ID
            commit_sha = $env:BUILD_COMMIT_SHA
            artifact_id = [long]$env:BUILD_ARTIFACT_ID
            artifact_name = "PRIME-AI-TRADER-Windows-x64"
            artifact_url = $env:BUILD_ARTIFACT_URL
            artifact_digest = $env:BUILD_ARTIFACT_DIGEST
          } | ConvertTo-Json
          Set-Content -Path "BUILD_STATUS.json" -Value $status -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- BUILD_STATUS.json
          git commit -m "Registra instalador Windows gerado"
          git push origin "HEAD:${{ github.ref_name }}"
