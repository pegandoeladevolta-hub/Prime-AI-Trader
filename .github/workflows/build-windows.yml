name: Build PRIME AI TRADER for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-installer

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build and test application
        shell: powershell
        run: .\build_windows.ps1

      - name: Verify deliverables
        shell: powershell
        run: |
          if (-not (Test-Path "release\PrimeAITrader.exe")) { throw "PrimeAITrader.exe was not generated" }
          if (-not (Test-Path "release\PrimeAITrader-Setup-x64.exe")) { throw "Installer was not generated" }
          Get-FileHash "release\PrimeAITrader.exe" -Algorithm SHA256
          Get-FileHash "release\PrimeAITrader-Setup-x64.exe" -Algorithm SHA256

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-AI-TRADER-Windows-x64
          path: |
            release/PrimeAITrader.exe
            release/PrimeAITrader-Setup-x64.exe
            README.md
            RELEASE_NOTES.md
            VALIDATION_REPORT.md
          if-no-files-found: error
          retention-days: 7
