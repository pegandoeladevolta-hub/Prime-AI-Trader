[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-trader"
version = "1.3.1"
description = "Terminal desktop de análise e execução via MetaTrader 5"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "websockets>=14,<17",
  "cryptography>=44,<48",
  "openpyxl>=3.1,<4",
  "tzdata>=2025.2,<2027",
  "MetaTrader5>=5.0; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
include = ["prime_ai_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
